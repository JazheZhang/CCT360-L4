<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Break Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Study Break Check</h1>

    <p id="greeting"></p>

    <form id="breakForm">
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Jack">

      <label for="hoursInput">Hours studied so far</label>
      <input type="number" id="hoursInput" min="0" max="12" step="0.5" placeholder="e.g. 2">

      <label for="energyInput">Energy level</label>
      <select id="energyInput">
        <option value="">Choose one</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>

      <button type="submit">Check</button>
    </form>

    <!-- The result appears here -->
    <div id="result" class="hidden">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </div>

    <p id="checkCount"></p>
    <button id="resetButton" class="secondary">Forget me</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
